name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax-check backend and browser scripts
        run: find src public -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: Build Docker image and check panel health
        shell: bash
        run: |
          set -euo pipefail
          docker build -t vps-node-smoke .
          docker run -d --name vps-node-smoke -p 127.0.0.1:13000:3000 vps-node-smoke
          trap 'docker rm -f vps-node-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:13000/api/health > /tmp/vps-health.json; then
              cat /tmp/vps-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs vps-node-smoke
          exit 1
      - name: Validate Sing-box preset schemas against official binary
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL --retry 2 https://api.github.com/repos/SagerNet/sing-box/releases/latest | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).tag_name.replace(/^v/,"")))')"
          curl -fL --retry 2 -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          mkdir -p /tmp/sb-release
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sb-release
          sudo install -m755 "$(find /tmp/sb-release -type f -name sing-box | head -1)" /usr/local/bin/sing-box
          sing-box version
          node scripts/check-singbox-configs.mjs

