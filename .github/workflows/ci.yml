name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax-check backend and browser scripts
        run: find src public -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - name: Validate domain-free presets with real sing-box binary
        shell: bash
        run: |
          set -euo pipefail
          version=1.14.3
          mkdir -p /tmp/singbox-verify /tmp/singbox-fixtures
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 \
            -o /tmp/singbox-verify/archive.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz"
          tar -xzf /tmp/singbox-verify/archive.tar.gz -C /tmp/singbox-verify
          binary="/tmp/singbox-verify/sing-box-${version}-linux-amd64/sing-box"
          "$binary" version
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout /tmp/singbox-fixtures/key.pem \
            -out /tmp/singbox-fixtures/cert.pem \
            -subj "/CN=localhost" >/dev/null 2>&1
          node test/fixtures/generate-singbox-fixtures.mjs /tmp/singbox-fixtures
          for file in /tmp/singbox-fixtures/*.json; do
            echo "Validating $(basename "$file")"
            "$binary" check -c "$file"
          done
      - name: Validate Sing-box preset schemas against official binary
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL --retry 2 https://api.github.com/repos/SagerNet/sing-box/releases/latest | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).tag_name.replace(/^v/,"")))')"
          curl -fL --retry 2 -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          mkdir -p /tmp/sb-release
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sb-release
          sudo install -m755 "$(find /tmp/sb-release -type f -name sing-box | head -1)" /usr/local/bin/sing-box
          sing-box version
          node scripts/check-singbox-configs.mjs

