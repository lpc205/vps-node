<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VPS 节点控制台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/xterm.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon"><i data-lucide="server-cog"></i></span>
        <span>VPS Console</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="overview" title="总览">
          <i data-lucide="layout-dashboard"></i><span>总览</span>
        </button>
        <button class="nav-item" data-view="servers" title="服务器">
          <i data-lucide="server"></i><span>服务器</span>
        </button>
        <button class="nav-item" data-view="nodes" title="节点">
          <i data-lucide="network"></i><span>节点</span>
        </button>
        <button class="nav-item" data-view="routes" title="路由">
          <i data-lucide="route"></i><span>路由</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <span class="status-dot"></span>
        <span>本地运行</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">总览</h1>
          <p id="page-subtitle">SSH 远程节点管理</p>
        </div>
        <div class="top-actions">
          <button id="refresh-btn" class="icon-btn" title="刷新" aria-label="刷新">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
      </header>

      <section id="view-overview" class="view active">
        <div class="metric-grid">
          <div class="metric">
            <span class="metric-icon teal"><i data-lucide="server"></i></span>
            <div>
              <span class="metric-label">服务器</span>
              <strong id="metric-servers">0</strong>
            </div>
          </div>
          <div class="metric">
            <span class="metric-icon indigo"><i data-lucide="network"></i></span>
            <div>
              <span class="metric-label">节点</span>
              <strong id="metric-nodes">0</strong>
            </div>
          </div>
          <div class="metric">
            <span class="metric-icon amber"><i data-lucide="activity"></i></span>
            <div>
              <span class="metric-label">启用节点</span>
              <strong id="metric-enabled">0</strong>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>最近节点</h2>
            <button id="overview-go-nodes" class="btn ghost sm" title="前往节点页">
              <i data-lucide="arrow-right"></i>
              查看节点
            </button>
          </div>
          <div id="overview-nodes" class="overview-nodes"></div>
        </div>
      </section>

      <section id="view-servers" class="view">
        <div class="page-toolbar">
          <div class="toolbar-copy">管理 SSH 连接与远程部署目标</div>
          <div class="toolbar-actions">
            <label class="auto-repair-toggle" title="开启后检测到服务停止会弹出确认框，不会自动执行">
              <span>自动修复</span>
              <input type="checkbox" id="auto-repair-switch">
              <span class="switch"></span>
            </label>
            <button id="add-server-btn" class="btn primary" title="添加服务器">
              <i data-lucide="plus"></i>
              添加服务器
            </button>
          </div>
        </div>
        <div id="server-grid" class="server-grid"></div>
      </section>

      <section id="view-nodes" class="view">
        <div class="page-toolbar">
          <div class="toolbar-copy">
            <label class="select-wrap">
              <span>目标服务器</span>
              <select id="node-server-select"></select>
            </label>
          </div>
          <div class="toolbar-actions">
            <button id="deploy-server-btn" class="btn accent" title="生成并写入全部节点配置，然后重启 Xray">
              <i data-lucide="upload-cloud"></i>
              部署全部节点
            </button>
            <button id="add-node-btn" class="btn primary" title="添加节点">
              <i data-lucide="plus"></i>
              添加节点
            </button>
          </div>
        </div>
        <div id="node-grid" class="node-grid"></div>
      </section>
      <section id="view-routes" class="view">
        <div class="page-toolbar">
          <div class="toolbar-copy">选择入站节点和出站节点建立转发链路</div>
          <div class="toolbar-actions">
            <button id="clear-route-selection-btn" class="btn ghost" title="清除已选的入站和出站"><i data-lucide="x"></i>清除选择</button>
            <button id="create-route-btn" class="btn primary" disabled title="连接所选入站和出站"><i data-lucide="link-2"></i>连接所选节点</button>
          </div>
        </div>
        <div class="route-layout">
          <section class="panel route-panel">
            <div class="panel-head">
              <h2>入站</h2>
              <span id="inbound-count" class="hint">0 个</span>
            </div>
            <div id="route-inbound-list" class="route-node-list"></div>
          </section>
          <section class="panel route-panel">
            <div class="panel-head">
              <h2>出站</h2>
              <span id="outbound-count" class="hint">0 个</span>
            </div>
            <div id="route-outbound-list" class="route-node-list"></div>
          </section>
        </div>
        <div class="panel">
          <div class="panel-head">
            <h2>已连接链路</h2>
          </div>
          <div id="route-link-list" class="route-link-list"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/vendor/lucide.js"></script>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/xterm-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
