name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 描述使用场景比只写功能名更有帮助。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作，可以写界面、流程或命令示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前是怎么绕过的？有没有考虑过其他实现方式？
    validations:
      required: false
